<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_3 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_3" style="display:block;"><svg viewbox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="glassGradient" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" style="stop-color:rgba(255,255,255,0.2);stop-opacity:1"></stop>
<stop offset="100%" style="stop-color:rgba(255,255,255,0.05);stop-opacity:1"></stop>
</lineargradient>
</defs>
<!-- The Outlet -->
<rect fill="url(#glassGradient)" height="120" rx="10" stroke="rgba(255,255,255,0.3)" stroke-width="2" width="80" x="60" y="40"></rect>
<circle cx="85" cy="70" fill="rgba(255,255,255,0.1)" r="8" stroke="rgba(255,255,255,0.3)"></circle>
<circle cx="115" cy="70" fill="rgba(255,255,255,0.1)" r="8" stroke="rgba(255,255,255,0.3)"></circle>
<circle cx="85" cy="130" fill="rgba(255,255,255,0.1)" r="8" stroke="rgba(255,255,255,0.3)"></circle>
<circle cx="115" cy="130" fill="rgba(255,255,255,0.1)" r="8" stroke="rgba(255,255,255,0.3)"></circle>
<!-- The Plug (Animated via CSS in the screen) -->
<g class="plug-motion" id="plug-group">
<rect fill="#00FF94" height="40" rx="5" width="50" x="75" y="170"></rect>
<rect fill="#00FF94" height="15" width="6" x="85" y="155"></rect>
<rect fill="#00FF94" height="15" width="6" x="109" y="155"></rect>
</g>
<style>
    @keyframes plugIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .plug-motion {
      animation: plugIn 1s ease-out infinite alternate;
    }
  </style>
</svg></div><!-- STITCH_SVG_END:ANIMATION_3 -->
</body>
</html>
